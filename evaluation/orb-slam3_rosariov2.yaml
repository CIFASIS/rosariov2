%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
Camera.type: "PinHole"

# Camera calibration and distortion parameters (OpenCV)
Camera.fx: 648.8624169653789
Camera.fy: 648.8624169653789
Camera.cx: 645.0113372802734
Camera.cy: 348.24266815185547

Camera.k1: 0.0
Camera.k2: 0.0
Camera.p1: 0.0
Camera.p2: 0.0

Camera.width: 1280
Camera.height: 720

# Camera frames per second 
Camera.fps: 15

# stereo baseline times fx
Camera.bf: 32.27032495

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

# Close/Far threshold. Baseline times.
ThDepth: 80.0

# Transformation from camera 0 to body-frame (imu)
Tbc: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [ 0.999992, -0.003898, -0.000576, -0.004483,
           0.003895,  0.999979, -0.005012,  0.019179,
           0.000596,  0.005009,  0.999987,  0.027584,
           0.000000,  0.000000,  0.000000,  1.000000]

# IMU noise
IMU.NoiseGyro: 2.324e-04 
IMU.NoiseAcc:  9.943e-04
IMU.GyroWalk:  1.823e-06
IMU.AccWalk:   4.750e-05
IMU.Frequency: 200

